[project]
name = "autostills"
version = "0.0.0"
description = "DaVinci Resolve script that picks the best still of each shot (faces, sharpness, exposure) instead of the first or middle frame"
readme = "README.md"
license = "MIT"
authors = [{ name = "Max Lainz" }]
requires-python = ">=3.11"
# Dependencias de análisis: pendientes de decidir el stack (ver docs/investigacion.md).
dependencies = [
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
